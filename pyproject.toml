[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argaudioworkbench"
version = "0.1.0"
description = "Cross-platform audio analysis tool for ARG spectrogram art and decoder helpers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "ArgAudioWorkbench Contributors" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "PySide6>=6.6",
  "pyqtgraph>=0.13",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
mp3 = [
  "pydub>=0.25",
]

[project.scripts]
argaudioworkbench = "argaudioworkbench.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/argaudioworkbench"]
